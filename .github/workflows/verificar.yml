name: Verificar FisicAI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run repo:check
      - run: npm run prepare:assets
      - run: npm run typecheck
      - run: npm test
      - run: git diff --exit-code -- data/math-rendered.json
      - run: npx --no-install expo export --platform web --platform android
      - name: Registrar auditoria de dependências
        run: npm audit --json > auditoria-ci.json
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auditoria-dependencias
          path: auditoria-ci.json
          retention-days: 14
